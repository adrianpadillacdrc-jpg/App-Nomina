server.port=8080
spring.datasource.url=jdbc:postgresql://host.docker.internal:5432/numadb
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.data.mongodb.uri=mongodb://host.docker.internal:27017/numa_mongo
spring.mongodb.uri=mongodb://host.docker.internal:27017/numa_mongo
spring.mongodb.database=numa_mongo
spring.data.redis.host=redis
spring.data.redis.port=6379
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
logging.level.com.nomina.numa=DEBUG
logging.level.org.springframework.security=DEBUG
spring.web.cors.allowed-origins=http://localhost:4200

# SMTP: configurar mediante variables de entorno para enviar confirmaciones.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
