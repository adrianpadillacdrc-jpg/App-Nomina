# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/numadb
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# MongoDB Configuration
spring.data.mongodb.uri=mongodb://localhost:27017/numa_mongo
spring.data.mongodb.database=numa_mongo

# Server Configuration
server.port=8080
# Valores 2026 provisionales informados por el usuario, pendientes de cotejo con los decretos oficiales.
nomina.salario-minimo-2026=${NOMINA_SALARIO_MINIMO_2026:1750905}
nomina.auxilio-transporte-2026=${NOMINA_AUXILIO_TRANSPORTE_2026:249095}
nomina.exoneracion-114-1=${NOMINA_EXONERACION_114_1:true}
nomina.jornada-semanal-2026=${NOMINA_JORNADA_SEMANAL_2026:42}
server.error.include-message=always
server.error.include-binding-errors=always

# Gemini is called by the backend; never expose this key to Angular.
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.8-flash}

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.com.nomina.numa=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# CORS Configuration
spring.web.cors.allowed-origins=http://localhost:4200
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# Spring Boot DevTools
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# Redis (historial de conversaciones del chatbot)
spring.data.redis.host=localhost
spring.data.redis.port=6379

