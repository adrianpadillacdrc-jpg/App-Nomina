<div class="register-wrapper">
  <div class="register-card">
    <h1>Registro de Usuario</h1>

    <form (ngSubmit)="registrar()">
      <div class="field">
        <label for="reg-nombre">Nombre de usuario</label>
        <input id="reg-nombre" [(ngModel)]="nombre" name="nombre" placeholder="Ej: juanperez" required autocomplete="username" />
      </div>

      <div class="field">
        <label for="reg-correo">Correo electrónico</label>
        <input id="reg-correo" [(ngModel)]="correo" name="correo" type="email" placeholder="ejemplo@email.com" required autocomplete="email" />
      </div>

      <div class="field">
        <label for="reg-pass">Contraseña</label>
        <input id="reg-pass" [(ngModel)]="contrasena" name="contrasena" type="password" placeholder="Mínimo 6 caracteres" required autocomplete="new-password" />
      </div>

      <div class="field">
        <label for="reg-confirm">Confirmar contraseña</label>
        <input id="reg-confirm" [(ngModel)]="confirmarContrasena" name="confirmarContrasena" type="password" required autocomplete="new-password" />
      </div>

      <div class="field">
        <label for="reg-rol">Rol</label>
        <select id="reg-rol" [(ngModel)]="rol" name="rol">
          <option value="EMPLEADO">Empleado</option>
          <option value="ADMIN">Administrador</option>
        </select>
      </div>

      <button type="submit" [disabled]="loading || !nombre || !correo || !contrasena">
        {{ loading ? 'Registrando...' : 'Registrarse' }}
      </button>

      <p *ngIf="success" class="success">{{ success }}</p>
      <p *ngIf="error" class="error">{{ error }}</p>
    </form>

    <p class="login-redirect">¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a></p>
  </div>
</div>
