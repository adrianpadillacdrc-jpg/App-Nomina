<!-- src/app/pages/registro-empleado/registro-empleado.component.html -->
<div class="page-wrapper">
  <app-sidebar></app-sidebar>

  <main class="main-content">
    <div class="registro-container">
      <app-encabezado-pagina titulo="Registro administrativo"></app-encabezado-pagina>

      <form (ngSubmit)="registrar()" #form="ngForm" class="registro-form">
        <!-- DATOS PERSONALES -->
        <div class="card">
          <div class="card-header">
            <h2>Datos Personales</h2>
          </div>

          <div class="form-grid">
            <div class="form-group">
              <label>Tipo de Documento</label>
              <select [(ngModel)]="empleado.tipoDocumento" name="tipoDocumento" required>
                <option value="C.C.">Cédula de Ciudadanía</option>
                <option value="C.E.">Cédula de Extranjería</option>
                <option value="Pasaporte">Pasaporte</option>
              </select>
            </div>

            <div class="form-group">
              <label>Número de Identificación</label>
              <input type="text" placeholder="Ej: 12345678" [(ngModel)]="empleado.numeroDocumento" name="numeroDocumento" required />
            </div>

            <div class="form-group">
              <label>Nombre</label>
              <input type="text" placeholder="Ej: Juan Carlos" [(ngModel)]="empleado.nombre" name="nombre" required />
            </div>

            <div class="form-group">
              <label>Apellido</label>
              <input type="text" placeholder="Ej: Pérez Rodríguez" [(ngModel)]="empleado.apellido" name="apellido" required />
            </div>

            <div class="form-group">
              <label>Edad</label>
              <input type="number" placeholder="Ej: 32" [(ngModel)]="empleado.edad" name="edad" min="18" />
            </div>

            <div class="form-group">
              <label>Género</label>
              <select [(ngModel)]="empleado.genero" name="genero">
                <option *ngFor="let g of generos">{{ g }}</option>
              </select>
            </div>

            <div class="form-group full">
              <label>Dirección</label>
              <input type="text" placeholder="Calle, Carrera, Ciudad" [(ngModel)]="empleado.direccion" name="direccion" />
            </div>
          </div>
        </div>

        <!-- DATOS LABORALES -->
        <div class="card">
          <div class="card-header">
            <h2>Datos Laborales</h2>
          </div>

          <div class="form-grid">
            <div class="form-group">
              <label>Sucursal Asignada</label>
              <select [(ngModel)]="empleado.idSucursal" name="idSucursal" required>
                <option *ngFor="let s of sucursales" [ngValue]="s.id">{{ s.nombre }}</option>
              </select>
            </div>

            <div class="form-group">
              <label>Cargo</label>
              <select [(ngModel)]="empleado.cargo" name="cargo" required>
                <option value="">Seleccione un cargo</option>
                <option *ngFor="let c of cargos">{{ c }}</option>
              </select>
            </div>

            <div class="form-group">
              <label>Tipo de Contrato</label>
              <select [(ngModel)]="empleado.tipoContrato" name="tipoContrato">
                <option value="">Seleccione</option>
                <option *ngFor="let t of tiposContrato">{{ t }}</option>
              </select>
            </div>

            <div class="form-group">
              <label>Salario</label>
              <input type="number" placeholder="Ej: 2500000" [(ngModel)]="empleado.salarioBase" name="salarioBase" required min="1750905" />
            </div>

            <div class="form-group">
              <label>Tasa ARL asignada (%)</label>
              <input type="number" placeholder="Ej: 0.522" [(ngModel)]="empleado.tasaArl" name="tasaArl" required min="0.001" max="100" step="0.001" />
            </div>

            <div class="form-group">
              <label>Modalidad de trabajo</label>
              <select [(ngModel)]="empleado.modalidadTrabajo" name="modalidadTrabajo" required>
                <option value="PRESENCIAL">Presencial</option>
                <option value="REMOTO">Remoto</option>
              </select>
            </div>

            <div class="form-group">
              <label>¿La empresa suministra transporte?</label>
              <select [(ngModel)]="empleado.transporteSuministrado" name="transporteSuministrado" required>
                <option [ngValue]="false">No</option>
                <option [ngValue]="true">Sí</option>
              </select>
            </div>

            <div class="form-group">
              <label>Estado</label>
              <select [value]="'Activo'" disabled>
                <option>Activo</option>
              </select>
            </div>

            <div class="form-group">
              <label>Empresa</label>
              <input type="text" value="NUMA STORE" readonly />
            </div>

            <div class="form-group">
              <label>Correo Empresarial</label>
              <input type="email" placeholder="usuario@empresa.com" [(ngModel)]="empleado.correoEmpresarial" name="correoEmpresarial" />
            </div>

            <div class="form-group">
              <label>Forma de pago</label>
              <select [(ngModel)]="empleado.metodoPago" name="metodoPago" required>
                <option *ngFor="let metodo of metodosPago" [value]="metodo">{{ metodo }}</option>
              </select>
            </div>

            <ng-container *ngIf="empleado.metodoPago === 'Cuenta bancaria'">
              <div class="form-group">
                <label>Banco</label>
                <input type="text" [(ngModel)]="empleado.banco" name="banco" placeholder="Nombre del banco" />
              </div>
              <div class="form-group">
                <label>Tipo de cuenta</label>
                <select [(ngModel)]="empleado.tipoCuenta" name="tipoCuenta">
                  <option *ngFor="let tipo of tiposCuenta" [value]="tipo">{{ tipo }}</option>
                </select>
              </div>
              <div class="form-group">
                <label>Número de cuenta</label>
                <input type="text" inputmode="numeric" [(ngModel)]="empleado.numeroCuenta" name="numeroCuenta" placeholder="Número de cuenta" />
              </div>
            </ng-container>

            <div class="form-group" *ngIf="empleado.metodoPago === 'Tarjeta'">
              <label>Número de tarjeta</label>
              <input type="text" inputmode="numeric" [(ngModel)]="numeroTarjeta" name="numeroTarjeta" placeholder="Solo se guardarán los últimos 4 dígitos" />
            </div>

            <div class="form-group">
              <label>Fecha de Inicio</label>
              <input type="date" [(ngModel)]="empleado.fechaInicioContrato" name="fechaInicioContrato" />
            </div>

            <div class="form-group">
              <label>Fecha de Fin</label>
              <input type="date" [(ngModel)]="empleado.fechaFinContrato" name="fechaFinContrato" />
            </div>
          </div>
        </div>

        <!-- BOTONES -->
        <div class="actions">
          <button type="submit" [disabled]="form.invalid || loading" class="btn-primary">
            <span *ngIf="!loading">Guardar Registro</span>
            <span *ngIf="loading">Guardando...</span>
          </button>
          <button type="button" (click)="cancelar()" class="btn-secondary">
            Cancelar Registro
          </button>
        </div>
      </form>

      <!-- ÉXITO -->
      <div class="success" *ngIf="exito">
        ¡Empleado registrado con éxito! Redirigiendo...
      </div>
    </div>
  </main>
</div>
