<!-- src/app/components/sidebar/sidebar.component.html -->
<aside class="sidebar">
  <div class="logo-container">
    <img src="/assets/logo.svg" alt="NUMA Nómina" class="logo">
  </div>

  <app-notificaciones></app-notificaciones>

  <nav class="menu">
    <div class="menu-section menu-primary">
      <a routerLink="/dashboard" routerLinkActive="active">
        <i class="fas fa-home"></i><span>Inicio</span>
      </a>
    </div>

    <div class="menu-section">
      <h2 class="menu-section-title">Gestión</h2>
      <a routerLink="/registro" routerLinkActive="active">
        <i class="fas fa-user-plus"></i><span>Registrar</span>
      </a>
      <a routerLink="/contratos" routerLinkActive="active">
        <i class="fas fa-file-contract"></i><span>Contratos</span>
      </a>
      <a routerLink="/consultar" routerLinkActive="active">
        <i class="fas fa-search"></i><span>Consultar</span>
      </a>
    </div>

    <div class="menu-section">
      <h2 class="menu-section-title">Nómina</h2>
      <a routerLink="/liquidar" routerLinkActive="active">
        <i class="fas fa-file-invoice-dollar"></i><span>Liquidar</span>
      </a>
      <a routerLink="/admin-aprobaciones" routerLinkActive="active">
        <i class="fas fa-clipboard-list"></i><span>Novedades</span>
      </a>
      <a routerLink="/pago-nomina" routerLinkActive="active">
        <i class="fas fa-credit-card"></i><span>Pago Nómina</span>
      </a>
      <a routerLink="/periodos-nomina" routerLinkActive="active" class="periodos-link">
        <i class="fas fa-calendar-alt"></i><span>Períodos Nómina</span>
      </a>
    </div>

    <div class="menu-section">
      <h2 class="menu-section-title">Análisis</h2>
      <a routerLink="/historial" routerLinkActive="active">
        <i class="fas fa-history"></i><span>Historial</span>
      </a>
      <a routerLink="/optimizacion" routerLinkActive="active">
        <i class="fas fa-cogs"></i><span>Optimización</span>
      </a>
    </div>

    <div class="menu-section menu-footer">
      <button type="button" (click)="cerrarSesion()" class="logout">
        <i class="fas fa-sign-out-alt"></i><span>Salir</span>
      </button>
    </div>
  </nav>
</aside>

<app-chatbot-widget *ngIf="esAdministrador" mode="admin"></app-chatbot-widget>
