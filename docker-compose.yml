services:
  postgres:
    image: postgres:15
    container_name: nomina_postgres
    environment:
      POSTGRES_DB: numadb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: numanomina2025
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d numadb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  mongodb:
    image: mongo:6
    container_name: nomina_mongodb
    profiles:
      - legacy-docker-mongo
    volumes:
      - mongodb_data:/data/db
    networks:
      - app_network

  redis:
    image: redis:7-alpine
    container_name: nomina_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - app_network

  backend:
    build: ./backend
    container_name: nomina_backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATA_MONGODB_URI: mongodb://host.docker.internal:27017/numa_mongo
      SPRING_DATA_MONGODB_DATABASE: numa_mongo
      SPRING_MONGODB_URI: mongodb://host.docker.internal:27017/numa_mongo
      SPRING_MONGODB_DATABASE: numa_mongo
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    build: ./frontend
    container_name: numa-frontend
    ports:
      - "4200:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  postgres_data:
  mongodb_data:
  redis_data: